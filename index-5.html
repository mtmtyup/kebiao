<title>2026-2027第1学期课表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-app shell. Header with a cat mascot, a week switcher, one scrollable grid, a floating bottom dock (week / add / overview). */
:root {
  --bg: #f1f1fb;
  --surface: #ffffff;
  --fg: #1f2347;
  --muted: #666a92;
  --line: #dcdcf0;
  --accent: #4b3fb5;
  --accent-fg: #ffffff;
  --accent-soft: #e6e4fa;
  --gold: #eaa92a;
  --danger: #c0302f;
  --danger-bg: #fff0ee;
  --danger-line: #f5b9b3;
  --overlay: rgba(24, 26, 64, 0.5);
  --shadow: 0 3px 0 rgba(75, 63, 181, 0.14);
  --c-bg-s: 85%; --c-bg-l: 91%;
  --c-fg-s: 40%; --c-fg-l: 26%;
  --c-bd-s: 70%; --c-bd-l: 80%;
  --font: "Yuanti SC", "圆体-简", "YouYuan", "幼圆", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --rh: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142b;
    --surface: #1c1f3d;
    --fg: #eceefc;
    --muted: #a9aed6;
    --line: #2f3463;
    --accent: #f3c969;
    --accent-fg: #2a2108;
    --accent-soft: #2a2d58;
    --gold: #f3c969;
    --danger: #ff9a94;
    --danger-bg: #432326;
    --danger-line: #7a3d42;
    --overlay: rgba(0, 0, 0, 0.66);
    --shadow: none;
    --c-bg-s: 35%; --c-bg-l: 26%;
    --c-fg-s: 80%; --c-fg-l: 90%;
    --c-bd-s: 30%; --c-bd-l: 40%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142b;
  --surface: #1c1f3d;
  --fg: #eceefc;
  --muted: #a9aed6;
  --line: #2f3463;
  --accent: #f3c969;
  --accent-fg: #2a2108;
  --accent-soft: #2a2d58;
  --gold: #f3c969;
  --danger: #ff9a94;
  --danger-bg: #432326;
  --danger-line: #7a3d42;
  --overlay: rgba(0, 0, 0, 0.66);
  --shadow: none;
  --c-bg-s: 35%; --c-bg-l: 26%;
  --c-fg-s: 80%; --c-fg-l: 90%;
  --c-bd-s: 30%; --c-bd-l: 40%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 18px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

header { display: flex; align-items: center; gap: 12px; }
.mascot { flex: none; width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--accent); object-fit: cover; }
.m-star { fill: var(--gold); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.m-core { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.m-dot { fill: var(--accent); }
h1 { margin: 0; font-size: 24px; line-height: 1.2; color: var(--accent); text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.weeknav { display: inline-flex; align-items: center; gap: 8px; }
.btn {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; min-height: 38px; box-shadow: var(--shadow);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); border-color: var(--danger-line); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[disabled] { opacity: 0.4; cursor: default; }
select, input[type="text"], input[type="number"], input[type="date"] {
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  padding: 7px 12px; min-height: 40px; width: 100%;
}
select:focus, input:focus { border-color: var(--accent); }
.weeknav select { width: auto; border-radius: 999px; font-weight: 700; color: var(--accent); }

.meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 14px; }

.tt-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.tt { display: grid; grid-template-columns: 34px repeat(var(--n), minmax(92px, 1fr)); min-width: calc(34px + var(--n) * 92px); }
.corner { border-bottom: 2px dashed var(--line); }
.head { margin: 6px 3px; padding: 5px 2px; text-align: center; font-weight: 700; line-height: 1.25; border-radius: 14px; }
.head small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.head.today { background: var(--accent); color: var(--accent-fg); }
.head.today small { color: var(--accent-fg); opacity: 0.9; }
.axis > div { height: var(--rh); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.col {
  position: relative; height: calc(13 * var(--rh)); border-top: 2px dashed var(--line);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rh) - 1px), var(--line) calc(var(--rh) - 1px), var(--line) var(--rh));
}
.col.today { background-color: var(--accent-soft); }

.card {
  position: absolute; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
  padding: 6px 7px; text-align: left; font-size: 12px; line-height: 1.3; cursor: pointer;
  border-radius: 12px;
  background: hsl(var(--h) var(--c-bg-s) var(--c-bg-l));
  color: hsl(var(--h) var(--c-fg-s) var(--c-fg-l));
  border: 2px solid hsl(var(--h) var(--c-bd-s) var(--c-bd-l));
  word-break: break-all;
}
.card:hover { filter: brightness(0.97); }
.card .nm { font-weight: 700; }
.card .dim { opacity: 0.88; }
.card.clash { border: 2px dashed var(--danger); }

.pending { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 2px dashed var(--line); border-radius: 20px; background: var(--surface); }
.pending h2 { margin: 0; font-size: 14px; color: var(--accent); }
.pending .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  background: hsl(var(--h) var(--c-bg-s) var(--c-bg-l)); color: hsl(var(--h) var(--c-fg-s) var(--c-fg-l));
  border: 2px solid hsl(var(--h) var(--c-bd-s) var(--c-bd-l)); }

details.settings { color: var(--muted); font-size: 13px; }
details.settings summary { cursor: pointer; }
.settings .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.settings input { width: auto; }

.dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
}
.dock button {
  border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 5px 20px; min-height: 46px; border-radius: 999px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.dock button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dock button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.dock .add {
  width: 58px; height: 58px; padding: 0; justify-content: center; margin: -22px 6px 0;
  border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 30px; line-height: 1;
  border: 4px solid var(--surface); box-shadow: 0 4px 0 rgba(75, 63, 181, 0.25);
}

.overlay {
  position: fixed; inset: 0; z-index: 30; background: var(--overlay); overflow: auto;
  display: flex; justify-content: center;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  margin: auto; width: 100%; max-width: 480px; background: var(--surface); border-radius: 26px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--line);
}
.sheet h2 { margin: 0; font-size: 19px; color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick { background: var(--accent-soft); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.quick .hint { font-size: 12px; color: var(--muted); min-height: 18px; }
.warn, .err { border-radius: 16px; padding: 10px 14px; font-size: 13px; background: var(--danger-bg); border: 2px solid var(--danger-line); color: var(--danger); }
.warn strong { display: block; margin-bottom: 4px; }
.warn ul { margin: 4px 0 0; padding-left: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.actions .spacer { margin-right: auto; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-fg); padding: 10px 18px; border-radius: 999px;
  max-width: calc(100% - 32px); font-size: 13px; font-weight: 700; text-align: center;
}
@media (max-width: 480px) {
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dock button { padding-inline: 16px; }
  .tt { grid-template-columns: 24px repeat(var(--n), minmax(52px, 1fr)); min-width: calc(24px + var(--n) * 52px); }
  .head { font-size: 12px; margin: 6px 1px; }
  .head small { font-size: 10px; }
  .card { font-size: 10.5px; padding: 4px; border-radius: 9px; gap: 1px; }
}
@media (prefers-reduced-motion: no-preference) { .card, .btn { transition: filter 0.15s, border-color 0.15s; } }
</style>

    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
    周视图
  </button>
  <button type="button" id="btn-add" class="add" aria-label="添加课程">+</button>
  <button type="button" id="tab-all" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    总览
  </button>
</nav>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="form-title" novalidate>
    <h2 id="form-title">添加课程</h2>

    <div class="quick">
      <label class="field">
        <span>快速填入（可选）：把选课系统里的时间地点整段粘贴进来</span>
        <input type="text" id="f-quick" placeholder="例如：1-17周 星期三 3-4节 X2213(犀浦)" autocomplete="off">
      </label>
      <div class="hint" id="quick-hint"></div>
    </div>

    <label class="field"><span>课程名称</span><input type="text" id="f-name" autocomplete="off"></label>
    <div class="grid2">
      <label class="field"><span>任课教师</span><input type="text" id="f-teacher" autocomplete="off"></label>
      <label class="field"><span>上课地点</span><input type="text" id="f-place" autocomplete="off"></label>
    </div>
    <div class="grid3">
      <label class="field"><span>星期</span><select id="f-day"></select></label>
      <label class="field"><span>开始节</span><select id="f-s"></select></label>
      <label class="field"><span>结束节</span><select id="f-e"></select></label>
    </div>
    <div class="grid3">
      <label class="field"><span>起始周</span><input type="number" id="f-w1" min="1" max="20" inputmode="numeric"></label>
      <label class="field"><span>结束周</span><input type="number" id="f-w2" min="1" max="20" inputmode="numeric"></label>
      <label class="field"><span>周次类型</span>
        <select id="f-parity"><option value="all">每周</option><option value="odd">单周</option><option value="even">双周</option></select>
      </label>
    </div>

    <div class="err" id="err" role="alert" hidden></div>
    <div class="warn" id="warn" role="alert" hidden></div>

    <div class="actions">
      <button class="btn danger spacer" type="button" id="btn-del" hidden>删除</button>
      <button class="btn" type="button" id="btn-cancel">取消</button>
      <button class="btn primary" type="submit" id="btn-save">保存</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  var RH = 56, N_SEC = 13, MAX_WEEK = 20;
  var DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var HUES = [215, 160, 25, 285, 345, 190, 48, 325, 105, 245, 5, 75];
  var KEY = 'timetable-2026-1';
  var DEFAULT_START = '2026-08-31';

  function E(name, teacher, place, day, s, e, w1, w2) {
    return { name: name, teacher: teacher, place: place, day: day, s: s, e: e, w1: w1, w2: w2, parity: 'all' };
  }
  function defaults() {
    var list = [
      E('体育健康课程Ⅰ', '张岳', '北区田径场(犀浦)', 3, 3, 4, 1, 17),
      E('计算机网络', '郑丹阳', 'X4156(犀浦)', 2, 6, 8, 1, 17),
      E('计算机网络工程实验', '贾真', '', '', null, null, 1, 17),
      E('计算机图形学', '李庆', 'X1310(犀浦)', 4, 3, 4, 1, 17),
      E('计算机图形学实验', '李庆', 'X7508(犀浦)', 4, 11, 13, 6, 16),
      E('软件工程', '何滨、赵娟', 'X1218(犀浦)', 5, 3, 5, 1, 17),
      E('Linux内核分析', '胡晓鹏', 'X2518(犀浦)', 1, 6, 7, 1, 17),
      E('软件工程实验', '何滨、赵娟', 'X7508(犀浦)', 5, 1, 2, 2, 17),
      E('软件测试实验', '叶家鸣', 'X7205(犀浦)', 2, 3, 5, 6, 16),
      E('软件测试D', '叶家鸣', 'X1415(犀浦)', 2, 9, 10, 1, 8),
      E('人机交互技术(含实验)', '李晓航', 'X2213(犀浦)', 3, 9, 10, 1, 17),
      E('人机交互技术(含实验)', '李晓航', 'X7507(犀浦)', 3, 11, 13, 6, 16),
      E('形势与政策V', '李萍', 'X1414(犀浦)', 4, 9, 10, 4, 6)
    ];
    list.forEach(function (x, i) { x.id = 'd' + i; });
    return list;
  }

  var entries = [], startDate = DEFAULT_START, mode = 'week', week = 1;
  var editingId = null, warnShown = false, delArmed = false, toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.entries)) { entries = d.entries; startDate = d.startDate || DEFAULT_START; return; }
      }
    } catch (err) {}
    entries = defaults();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ entries: entries, startDate: startDate })); } catch (err) {}
  }

  /* ---------- colors ---------- */
  function assignHue(name) {
    for (var i = 0; i < entries.length; i++) if (entries[i].name === name && entries[i].hue != null) return entries[i].hue;
    var used = {};
    entries.forEach(function (x) { if (x.hue != null) used[x.hue] = 1; });
    for (var j = 0; j < HUES.length; j++) if (!used[HUES[j]]) return HUES[j];
    return Math.floor(Math.random() * 360);
  }
  function ensureHues() {
    var seen = {};
    entries.forEach(function (x) {
      if (x.hue == null) x.hue = seen[x.name] != null ? seen[x.name] : assignHue(x.name);
      seen[x.name] = x.hue;
    });
  }

  /* ---------- time logic ---------- */
  function active(e, w) {
    if (w < e.w1 || w > e.w2) return false;
    if (e.parity === 'odd') return w % 2 === 1;
    if (e.parity === 'even') return w % 2 === 0;
    return true;
  }
  function sharedWeek(a, b) {
    for (var w = 1; w <= MAX_WEEK; w++) if (active(a, w) && active(b, w)) return true;
    return false;
  }
  function clashes(a, b) {
    if (a === b || !a.day || !b.day || a.day !== b.day) return false;
    return a.s <= b.e && b.s <= a.e && sharedWeek(a, b);
  }
  function findConflicts(x, ignoreId) {
    return entries.filter(function (o) { return o.id !== ignoreId && clashes(x, o); });
  }
  function weeksText(e) {
    var t = e.w1 === e.w2 ? '第' + e.w1 + '周' : e.w1 + '-' + e.w2 + '周';
    if (e.parity === 'odd') t += '(单)';
    if (e.parity === 'even') t += '(双)';
    return t;
  }
  function secText(e) { return e.s === e.e ? e.s + '节' : e.s + '-' + e.e + '节'; }
  function timeText(e) { return e.day ? DAY_NAMES[e.day - 1] + ' ' + secText(e) : '时间待定'; }

  function startMs() {
    var p = (startDate || DEFAULT_START).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).getTime();
  }
  function dateOf(w, d) {
    return new Date(startMs() + ((w - 1) * 7 + (d - 1)) * 864e5);
  }
  function fmt(dt) { return (dt.getMonth() + 1) + '/' + dt.getDate(); }
  function currentWeek() {
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
    return Math.floor(Math.round((today - startMs()) / 864e5) / 7) + 1;
  }
  function clampWeek(w) { return Math.max(1, Math.min(MAX_WEEK, w)); }

  /* ---------- rendering ---------- */
  function layout(list) {
    var arr = list.slice().sort(function (a, b) { return a.s - b.s || b.e - a.e; });
    var out = [], cluster = [], lanesEnd = [], clusterEnd = 0;
    function flush() {
      cluster.forEach(function (c) { c.lanes = lanesEnd.length; });
      out = out.concat(cluster); cluster = []; lanesEnd = []; clusterEnd = 0;
    }
    arr.forEach(function (e) {
      if (cluster.length && e.s > clusterEnd) flush();
      var lane = -1;
      for (var i = 0; i < lanesEnd.length; i++) if (lanesEnd[i] < e.s) { lane = i; break; }
      if (lane < 0) { lane = lanesEnd.length; lanesEnd.push(e.e); } else lanesEnd[lane] = e.e;
      cluster.push({ e: e, lane: lane });
      clusterEnd = Math.max(clusterEnd, e.e);
    });
    flush();
    return out;
  }

  function renderGrid() {
    var weekMode = mode === 'week';
    var nDays = entries.some(function (x) { return x.day >= 6; }) ? 7 : 5;
    var shown = entries.filter(function (x) { return x.day && (!weekMode || active(x, week)); });
    var todayDay = (new Date().getDay() + 6) % 7 + 1;
    var isCur = weekMode && week === currentWeek();

    var h = '<div class="corner"></div>';
    for (var d = 1; d <= nDays; d++) {
      h += '<div class="head' + (isCur && d === todayDay ? ' today' : '') + '">' + DAY_NAMES[d - 1] +
        (weekMode ? '<small>' + fmt(dateOf(week, d)) + '</small>' : '') + '</div>';
    }
    h += '<div class="axis">';
    for (var s = 1; s <= N_SEC; s++) h += '<div>' + s + '</div>';
    h += '</div>';
    for (d = 1; d <= nDays; d++) {
      h += '<div class="col' + (isCur && d === todayDay ? ' today' : '') + '">';
      var placed = layout(shown.filter(function (x) { return x.day === d; }));
      placed.forEach(function (p) {
        var e = p.e;
        var clash = entries.some(function (o) { return clashes(e, o); });
        var top = (e.s - 1) * RH + 1, height = (e.e - e.s + 1) * RH - 2;
        var left = 'calc(' + (100 * p.lane / p.lanes) + '% + 2px)';
        var width = 'calc(' + (100 / p.lanes) + '% - 4px)';
        h += '<button type="button" class="card' + (clash ? ' clash' : '') + '" data-id="' + esc(e.id) + '" style="--h:' + e.hue +
          ';top:' + top + 'px;height:' + height + 'px;left:' + left + ';width:' + width + '"' +
          ' aria-label="' + esc(e.name + '，' + timeText(e) + '，' + weeksText(e) + '，' + (e.place || '') + '，' + (e.teacher || '')) + '">' +
          '<span class="nm">' + esc(e.name) + '</span>' +
          (e.place ? '<span class="dim">' + esc(e.place) + '</span>' : '') +
          (e.teacher ? '<span class="dim">' + esc(e.teacher) + '</span>' : '') +
          (weekMode ? '' : '<span class="dim">' + esc(weeksText(e)) + '</span>') +
          '</button>';
      });
      h += '</div>';
    }
    var g = $('grid');
    g.style.setProperty('--n', nDays);
    g.innerHTML = h;
  }

  function renderPending() {
    var weekMode = mode === 'week';
    var list = entries.filter(function (x) { return !x.day && (!weekMode || active(x, week)); });
    $('pending').hidden = list.length === 0;
    $('pending-list').innerHTML = list.map(function (e) {
      return '<button type="button" class="chip" data-id="' + esc(e.id) + '" style="--h:' + e.hue + '">' +
        esc(e.name) + (e.teacher ? ' · ' + esc(e.teacher) : '') + ' · ' + esc(weeksText(e)) + ' · 时间待定</button>';
    }).join('');
  }

  function renderMeta() {
    var weekMode = mode === 'week';
    $('weeknav').hidden = !weekMode;
    $('tab-week').setAttribute('aria-pressed', weekMode);
    $('tab-all').setAttribute('aria-pressed', !weekMode);
    $('week-select').value = week;
    $('prev').disabled = week <= 1;
    $('next').disabled = week >= MAX_WEEK;
    var names = {};
    var list = entries.filter(function (x) { return !weekMode || active(x, week); });
    list.forEach(function (x) { names[x.name] = 1; });
    var clashCount = 0;
    entries.forEach(function (a, i) { for (var j = i + 1; j < entries.length; j++) if (clashes(a, entries[j])) clashCount++; });
    var m = '';
    if (weekMode) {
      m += '<span>第' + week + '周 · ' + fmt(dateOf(week, 1)) + ' – ' + fmt(dateOf(week, 7)) + '</span>';
      m += '<span>本周 ' + Object.keys(names).length + ' 门课</span>';
      if (week === currentWeek()) m += '<span>当前周</span>';
    } else {
      m += '<span>全部周次叠在一起，每张卡片注明上课周次</span>';
      m += '<span>共 ' + Object.keys(names).length + ' 门课</span>';
    }
    if (clashCount) m += '<span style="color:var(--danger)">有 ' + clashCount + ' 处时间冲突（虚线红框）</span>';
    $('meta').innerHTML = m;
    $('sub').textContent = '2026-2027 第1学期 · 点课程卡片可以修改或删除';
  }

  function render() { ensureHues(); renderMeta(); renderGrid(); renderPending(); }

  /* ---------- form ---------- */
  function fillSelects() {
    var h = '<option value="">暂未安排</option>';
    DAY_NAMES.forEach(function (n, i) { h += '<option value="' + (i + 1) + '">' + n + '</option>'; });
    $('f-day').innerHTML = h;
    var s = '';
    for (var i = 1; i <= N_SEC; i++) s += '<option value="' + i + '">第' + i + '节</option>';
    $('f-s').innerHTML = s; $('f-e').innerHTML = s;
    var w = '';
    for (i = 1; i <= MAX_WEEK; i++) w += '<option value="' + i + '">第' + i + '周</option>';
    $('week-select').innerHTML = w;
  }
  function syncDayState() {
    var none = $('f-day').value === '';
    $('f-s').disabled = none; $('f-e').disabled = none;
  }
  function resetWarn() { warnShown = false; $('warn').hidden = true; $('btn-save').textContent = '保存'; }

  function openForm(entry) {
    editingId = entry ? entry.id : null;
    delArmed = false;
    $('btn-del').textContent = '删除'; $('btn-del').classList.remove('armed');
    $('form-title').textContent = entry ? '编辑课程' : '添加课程';
    $('btn-del').hidden = !entry;
    $('f-quick').value = ''; $('quick-hint').textContent = '';
    $('f-name').value = entry ? entry.name : '';
    $('f-teacher').value = entry ? entry.teacher : '';
    $('f-place').value = entry ? entry.place : '';
    $('f-day').value = entry ? String(entry.day) : '1';
    $('f-s').value = entry && entry.s ? entry.s : 1;
    $('f-e').value = entry && entry.e ? entry.e : 2;
    $('f-w1').value = entry ? entry.w1 : 1;
    $('f-w2').value = entry ? entry.w2 : 17;
    $('f-parity').value = entry ? entry.parity : 'all';
    $('err').hidden = true; resetWarn(); syncDayState();
    $('overlay').hidden = false;
    $('f-name').focus();
  }
  function closeForm() { $('overlay').hidden = true; editingId = null; }

  function showErr(msg) { var el = $('err'); el.textContent = msg; el.hidden = false; }

  function parseQuick(text) {
    var r = {}, rest = text, m;
    if ((m = rest.match(/(\d+)\s*[-~－—–]\s*(\d+)\s*周/))) { r.w1 = +m[1]; r.w2 = +m[2]; rest = rest.replace(m[0], ' '); }
    else if ((m = rest.match(/(\d+)\s*周/))) { r.w1 = r.w2 = +m[1]; rest = rest.replace(m[0], ' '); }
    if (/单周/.test(rest)) { r.parity = 'odd'; rest = rest.replace(/单周/, ' '); }
    else if (/双周/.test(rest)) { r.parity = 'even'; rest = rest.replace(/双周/, ' '); }
    if ((m = rest.match(/(?:星期|周)([一二三四五六日天])/))) { r.day = '一二三四五六日天'.indexOf(m[1]) % 7 + 1; rest = rest.replace(m[0], ' '); }
    if ((m = rest.match(/(\d+)\s*[-~－—–]\s*(\d+)\s*节/))) { r.s = +m[1]; r.e = +m[2]; rest = rest.replace(m[0], ' '); }
    else if ((m = rest.match(/(\d+)\s*节/))) { r.s = r.e = +m[1]; rest = rest.replace(m[0], ' '); }
    rest = rest.replace(/[,，;；]/g, ' ').replace(/\s+/g, ' ').trim();
    if (rest) r.place = rest;
    return r;
  }
  function onQuick() {
    var t = $('f-quick').value;
    if (!t.trim()) { $('quick-hint').textContent = ''; return; }
    var r = parseQuick(t), got = [];
    if (r.w1 != null) { $('f-w1').value = r.w1; $('f-w2').value = r.w2; got.push(weeksText({ w1: r.w1, w2: r.w2, parity: r.parity || 'all' })); }
    if (r.parity) $('f-parity').value = r.parity;
    if (r.day) { $('f-day').value = r.day; got.push(DAY_NAMES[r.day - 1]); syncDayState(); }
    if (r.s != null && r.s >= 1 && r.e <= N_SEC) { $('f-s').value = r.s; $('f-e').value = r.e; got.push(r.s === r.e ? r.s + '节' : r.s + '-' + r.e + '节'); }
    if (r.place) { $('f-place').value = r.place; got.push(r.place); }
    $('quick-hint').textContent = got.length ? '已识别：' + got.join('，') : '没有识别出时间，请手动填写下面的栏目';
    resetWarn();
  }

  function readForm() {
    var name = $('f-name').value.trim();
    if (!name) { showErr('请填写课程名称。'); return null; }
    var day = $('f-day').value === '' ? '' : +$('f-day').value;
    var s = day ? +$('f-s').value : null, e = day ? +$('f-e').value : null;
    var w1 = parseInt($('f-w1').value, 10), w2 = parseInt($('f-w2').value, 10);
    if (!(w1 >= 1 && w1 <= MAX_WEEK && w2 >= 1 && w2 <= MAX_WEEK)) { showErr('起始周和结束周要在 1 到 ' + MAX_WEEK + ' 之间。'); return null; }
    if (w2 < w1) { showErr('结束周不能早于起始周。'); return null; }
    if (day && e < s) { showErr('结束节不能早于开始节。'); return null; }
    return {
      name: name, teacher: $('f-teacher').value.trim(), place: $('f-place').value.trim(),
      day: day, s: s, e: e, w1: w1, w2: w2, parity: $('f-parity').value
    };
  }

  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
  }

  function onSubmit(ev) {
    ev.preventDefault();
    $('err').hidden = true;
    var x = readForm();
    if (!x) return;
    var conf = x.day ? findConflicts(x, editingId) : [];
    if (conf.length && !warnShown) {
      var w = $('warn');
      w.innerHTML = '<strong>时间冲突</strong>这门课和下面的课程在同一时间：<ul>' +
        conf.map(function (o) { return '<li>' + esc(o.name) + '（' + esc(timeText(o)) + '，' + esc(weeksText(o)) + '）</li>'; }).join('') +
        '</ul>修改时间可以避开冲突，也可以仍然保存。';
      w.hidden = false; warnShown = true;
      $('btn-save').textContent = '仍然保存';
      w.scrollIntoView({ block: 'nearest' });
      return;
    }
    var msg;
    if (editingId) {
      var old = entries.filter(function (o) { return o.id === editingId; })[0];
      var hue = old ? old.hue : null;
      for (var k in x) old[k] = x[k];
      if (hue == null) old.hue = assignHue(x.name);
      msg = '已保存：' + x.name;
    } else {
      x.id = 'u' + Date.now() + Math.floor(Math.random() * 1000);
      x.hue = assignHue(x.name);
      entries.push(x);
      msg = '已添加：' + x.name + '，' + timeText(x) + '，' + weeksText(x);
    }
    if (mode === 'week' && x.day && !active(x, week)) { week = x.w1; msg += '（已跳到第' + week + '周）'; }
    if (conf.length) msg += '（有冲突）';
    save(); closeForm(); render(); showToast(msg);
  }

  function onDelete() {
    if (!delArmed) {
      delArmed = true;
      $('btn-del').textContent = '确认删除'; $('btn-del').classList.add('armed');
      return;
    }
    var gone = entries.filter(function (o) { return o.id === editingId; })[0];
    entries = entries.filter(function (o) { return o.id !== editingId; });
    save(); closeForm(); render();
    showToast('已删除：' + (gone ? gone.name : ''));
  }

  /* ---------- wiring ---------- */
  function findById(id) { return entries.filter(function (o) { return o.id === id; })[0]; }
  function onPick(ev) {
    var b = ev.target.closest('[data-id]');
    if (b) { var e = findById(b.getAttribute('data-id')); if (e) openForm(e); }
  }

  function init() {
    load();
    fillSelects();
    var cw = currentWeek();
    week = clampWeek(cw);
    $('start-date').value = startDate;
    render();

    $('btn-add').addEventListener('click', function () { openForm(null); });
    $('tab-week').addEventListener('click', function () { mode = 'week'; render(); });
    $('tab-all').addEventListener('click', function () { mode = 'all'; render(); });
    $('prev').addEventListener('click', function () { week = clampWeek(week - 1); render(); });
    $('next').addEventListener('click', function () { week = clampWeek(week + 1); render(); });
    $('cur').addEventListener('click', function () { week = clampWeek(currentWeek()); render(); });
    $('week-select').addEventListener('change', function () { week = +this.value; render(); });
    $('grid').addEventListener('click', onPick);
    $('pending-list').addEventListener('click', onPick);

    $('start-date').addEventListener('change', function () {
      if (this.value) { startDate = this.value; save(); week = clampWeek(currentWeek()); render(); }
    });
    $('btn-reset').addEventListener('click', function () {
      if (!this.dataset.armed) { this.dataset.armed = '1'; this.textContent = '再点一次确认：会清掉你添加和修改的内容'; return; }
      delete this.dataset.armed; this.textContent = '恢复成选课记录里的初始课表';
      entries = defaults(); save(); render(); showToast('已恢复初始课表');
    });

    $('form').addEventListener('submit', onSubmit);
    $('form').addEventListener('input', function (ev) { if (ev.target.id !== 'f-quick') { $('err').hidden = true; } resetWarn(); });
    $('f-quick').addEventListener('input', onQuick);
    $('f-day').addEventListener('change', syncDayState);
    $('f-s').addEventListener('change', function () { if (+$('f-e').value < +$('f-s').value) $('f-e').value = $('f-s').value; });
    $('btn-cancel').addEventListener('click', closeForm);
    $('btn-del').addEventListener('click', onDelete);
    $('overlay').addEventListener('mousedown', function (ev) { if (ev.target === this) closeForm(); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('overlay').hidden) closeForm(); });
  }
  init();
})();

</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body></html>
